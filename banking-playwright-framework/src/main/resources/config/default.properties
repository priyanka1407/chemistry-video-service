# =====================================================================================
# Framework defaults. Layering (lowest -> highest precedence):
#   1. config/default.properties        (this file - safe defaults, NO secrets)
#   2. config/<env>.properties          (-Denv=local|ci|uat)
#   3. JVM system properties            (-Dbrowser=firefox)
#   4. Environment variables            (BANK_BROWSER=firefox  -> key "browser")
# Keys map to env vars by upper-casing, replacing '.' with '_' and prefixing BANK_.
# =====================================================================================

# ---------- target application
# app.embedded=true starts the bundled sample bank on a random free port.
app.embedded=true
base.url=
app.port=0

# ---------- browser  (chromium | firefox | webkit)
browser=chromium
# Optional branded channel: chrome | msedge. Empty = Playwright's bundled, version-pinned build.
browser.channel=
headless=true
slow.mo.ms=0
viewport.width=1366
viewport.height=900
# Pin locale/timezone so dates, currency formatting and cut-off logic are deterministic on every runner.
locale=en-GB
timezone=Europe/London

# ---------- timeouts (ms) - fail fast; auto-waiting makes long timeouts unnecessary
timeout.action=10000
timeout.navigation=20000
timeout.assertion=7000
timeout.async.settlement=30000

# ---------- artifacts
# trace.mode: off | on | retain-on-failure
trace.mode=retain-on-failure
screenshot.on.failure=true
video.on.failure=false
artifacts.dir=target/playwright-artifacts

# ---------- authentication / storage state
auth.state.dir=target/.auth
auth.state.ttl.minutes=20

# ---------- test data
# data.seed empty -> random seed per run (printed in the log so failures are reproducible).
data.seed=
data.reference.prefix=QA

# ---------- network
# Mock third-party dependencies (FX provider) by default so tests do not depend on external uptime.
mock.third.party=true
