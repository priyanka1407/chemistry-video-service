# ======================================================================================
# PARALLEL EXECUTION (JUnit 5)
# ======================================================================================
# concurrent classes AND methods: every test gets its own BrowserContext, so tests are
# isolated by construction. Each worker thread owns one Playwright + one Browser
# (see BrowserManager). Rule of thumb: parallelism = CPU cores (headless) and ~2 GB RAM
# per browser. In CI raise it via -Djunit.jupiter.execution.parallel.config.fixed.parallelism=N
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
# Cap the ForkJoinPool: without it, blocked threads can make JUnit spawn extra threads (= extra browsers).
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
junit.jupiter.execution.parallel.config.fixed.saturate=true

# Tests that touch shared mutable state opt out with @ResourceLock("...") or @Isolated
# instead of turning parallelism off globally.

# Hard ceiling so a hung test can never block a CI agent forever.
junit.jupiter.execution.timeout.default=3m
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
